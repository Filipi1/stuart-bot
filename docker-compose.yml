version: '3.8'

services:
  stuart-bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./audios:/app/audios
    environment:
      - NODE_ENV=production
    env_file:
      - .env
  stuart-db:
    image: mysql:5.7
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_USER: root
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: db_stuart
      MYSQL_PASSWORD: secret