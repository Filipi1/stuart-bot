name: Deploy to Production

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  REGISTRY_IMAGE_NAME: ghcr.io/${{ github.repository }}:main

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Tailscale first - essential for deployment
      - name: Setup Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:prod
          version: latest

      # Wait for Tailscale to connect and verify
      - name: Wait for Tailscale connection
        id: wait-tailscale
        run: |
          echo "Waiting for Tailscale to connect..."
          
          # Wait up to 2 minutes for connection
          for i in {1..12}; do
            echo "Attempt $i/12: Checking Tailscale status..."
            
            if tailscale status --json | jq -e '.Peer' > /dev/null 2>&1; then
              echo "✅ Tailscale connected successfully!"
              break
            fi
            
            if [ $i -eq 12 ]; then
              echo "❌ Tailscale failed to connect after 2 minutes"
              tailscale status
              exit 1
            fi
            
            echo "Waiting 10 seconds before next attempt..."
            sleep 10
          done

      # Get target machine IP early
      - name: Get target machine IP
        id: get-ip
        run: |
          echo "Looking for hostname: ${{ vars.TAILSCALE_HOSTNAME }}"
          
          # Get all peers
          PEERS=$(tailscale status --json | jq -r '.Peer[] | .HostName + ":" + .TailscaleIPs[0]')
          echo "Available peers:"
          echo "$PEERS"
          
          # Find target machine
          TARGET_IP=$(echo "$PEERS" | grep "^${{ vars.TAILSCALE_HOSTNAME }}:" | cut -d: -f2)
          
          if [ -z "$TARGET_IP" ]; then
            echo "❌ Could not find IP for hostname '${{ vars.TAILSCALE_HOSTNAME }}'"
            echo "Available hostnames:"
            echo "$PEERS" | cut -d: -f1
            exit 1
          fi
          
          echo "✅ Found IP: $TARGET_IP"
          echo "TAILSCALE_IP=$TARGET_IP" >> $GITHUB_ENV

      # Test SSH connection before building
      - name: Test SSH connection
        run: |
          echo "Testing SSH connection to ${{ env.TAILSCALE_IP }}..."
          
          # Install sshpass for password authentication
          sudo apt-get update && sudo apt-get install -y sshpass
          
          # Test connection with password
          timeout 30 sshpass -p "${{ vars.REMOTE_PASS }}" ssh \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p ${{ vars.REMOTE_PORT }} \
            ${{ vars.REMOTE_USER }}@${{ env.TAILSCALE_IP }} \
            "echo 'SSH connection successful'"
          
          if [ $? -eq 0 ]; then
            echo "✅ SSH connection test passed - ready to build and deploy"
          else
            echo "❌ SSH connection test failed - stopping before build"
            exit 1
          fi

      # Build and push Docker image (only after Tailscale is confirmed)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            NODE_ENV=production

      # Deploy to production
      - name: Deploy to Production
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.TAILSCALE_IP }}
          username: ${{ vars.REMOTE_USER }}
          password: ${{ vars.REMOTE_PASS }}
          port: ${{ vars.REMOTE_PORT }}
          script: |
            echo "🚀 Starting deployment..."
            
            # Login to Docker registry
            docker login ghcr.io -u ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }}
            
            # Pull latest image
            docker pull ${{ env.REGISTRY_IMAGE_NAME }}
            
            # Stop and remove old container
            docker stop stuart-bot 2>/dev/null || true
            docker rm stuart-bot 2>/dev/null || true
            
            # Run new container
            docker run -d \
              -e BOT_TOKEN="${{ secrets.BOT_TOKEN }}" \
              -e TELEGRAM_TOKEN="${{ secrets.TELEGRAM_TOKEN }}" \
              -e DROPBOX_AUTH_TOKEN="${{ secrets.DROPBOX_AUTH_TOKEN }}" \
              -e DROPBOX_BASE_URL="${{ secrets.DROPBOX_BASE_URL }}" \
              -e DROPBOX_REFRESH_TOKEN="${{ secrets.DROPBOX_REFRESH_TOKEN }}" \
              -e DROPBOX_PASTE_DIRECTORY="${{ vars.DROPBOX_PASTE_DIRECTORY }}" \
              -e OLLAMA_BASE_URL="${{ secrets.OLLAMA_BASE_URL }}" \
              -e SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
              -e SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
              --name stuart-bot \
              --network bot_network \
              --restart unless-stopped \
              -v $(pwd)/audios:/app/audios \
              ${{ env.REGISTRY_IMAGE_NAME }}
            
            # Verify container is running
            sleep 5
            if docker ps | grep -q stuart-bot; then
              echo "✅ Deployment successful! Container is running."
              docker logs --tail 10 stuart-bot
            else
              echo "❌ Deployment failed! Container is not running."
              docker logs stuart-bot
              exit 1
            fi
